name: Build and Release MAGI System IDE

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller pywebview

    - name: Build Frontend
      working-directory: ./magi-gui
      run: |
        npm install
        npm run build

    - name: Build Executable (PyInstaller)
      run: |
        pyinstaller --clean --onefile --noconsole --name "MAGI-IDE-v5" --icon "assets/icon.ico" --add-data "assets;assets" --add-data "magi-gui/dist;magi-gui/dist" magi/main.py

    - name: Zip Release
      run: |
        Compress-Archive -Path "dist/MAGI-IDE-v5.exe" -DestinationPath "dist/MAGI-IDE-v5.zip"

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: "MAGI System IDE ${{ github.ref_name }}"
        files: dist/MAGI-IDE-v5.zip
        body: |
          ## Novedades en ${{ github.ref_name }} 🚀
          
          - **Conclusiones Siempre Visibles & Acordeón Inline (`AgentMessageCard`):** Rediseñadas las tarjetas de las IAs (Melchior, Balthasar, Casper) para que la **Conclusión aparezca SIEMPRE visible a primera vista**. El análisis extenso se despliega inline con el botón `Ver análisis completo ▾` sin ventanas emergentes. Extracción automática de síntesis cuando los modelos omiten `### CONCLUSIÓN`.
          - **Ajuste Total de Viewport Height & Márgenes (`App.css`):** Restringido el contenedor maestro a `100vh` con `overflow-y: auto !important` y `word-break: break-word` / `overflow-wrap: anywhere`, evitando que el texto o las tarjetas se salgan de los márgenes o bloqueen el scroll.
          - **Naoko Multimodal con Lectura Visual de Imágenes (`FreeCloudLLM.generate_vision`):** Añadido soporte para adjuntar imágenes/capturas de pantalla en el chat de Naoko. Naoko procesa las imágenes con visión multimodal (`gpt-4o` / `gemini-1.5`) estilo Google Lens.
          - **Autoconciencia y Diagnósticos Directos en Naoko:** Actualizado el prompt de Naoko con conocimiento explícito de la interfaz React de 4 columnas para ofrecer explicaciones concretas, directas y sintéticas ("sin irse por las ramas").
        draft: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
