name: Build and Release MAGI System IDE

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller pywebview

    - name: Build Frontend
      working-directory: ./magi-gui
      run: |
        npm install
        npm run build

    - name: Build Executable (PyInstaller)
      run: |
        pyinstaller --clean --onefile --noconsole --name "MAGI-IDE-v3" --add-data "magi-gui/dist;magi-gui/dist" magi/main.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MAGI-IDE-v3.exe
        path: dist/MAGI-IDE-v3.exe
