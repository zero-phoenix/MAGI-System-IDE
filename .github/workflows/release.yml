name: Build and Release MAGI System IDE

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller pywebview

    - name: Build Frontend
      working-directory: ./magi-gui
      run: |
        npm install
        npm run build

    - name: Build Executable (PyInstaller)
      run: |
        pyinstaller --clean --onefile --noconsole --name "MAGI-IDE-v5" --add-data "magi-gui/dist;magi-gui/dist" magi/main.py

    - name: Create Release and Upload Asset
      uses: softprops/action-gh-release@v2
      with:
        files: dist/MAGI-IDE-v5.exe
        name: "MAGI System IDE V5.0.8 - UI Overhaul & Conversation Isolation"
        body: |
          ### 🚀 Actualizaciones y Modificaciones (V5.0.8):
          - **Aislamiento de Conversaciones (Pestañas):** La barra lateral ya no muestra "proyectos detectados". Ahora clasifica y aísla cada flujo de conversación en su propia pestaña real. Al cambiar de pestaña, el chat cambia dinámicamente sin perder contexto ni "borrar" nada.
          - **Contraste de UI Mejorado:** Se corrigió el error de visibilidad que volvía ilegibles los textos de los agentes en el modo oscuro.
          - **Nuevo Panel de Inteligencias Artificiales:** Se eliminó la configuración innecesaria de Ollama y API Keys. En su lugar, se agregó una tabla informativa detallando cada rol del enjambre (Melchior, Balthasar, Casper), sus modelos principales y el mecanismo de fallback anti-caídas (gpt-4o) soportado por G4F.
          - **Audio MP3 Personalizado:** Se integró el archivo de audio recortado del usuario como sonido principal del sistema.
          - **Regla Estricta de 3 Rondas y Aprobación Interactiva (Casper):** Mantiene las políticas estrictas de ejecución y revisión integradas en la V5.0.7.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
