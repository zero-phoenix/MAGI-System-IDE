name: Build and Release MAGI System IDE

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller pywebview

    - name: Build Frontend
      working-directory: ./magi-gui
      run: |
        npm install
        npm run build

    - name: Build Executable (PyInstaller)
      run: |
        pyinstaller --clean --onefile --noconsole --name "MAGI-IDE-v5" --icon "assets/icon.ico" --add-data "assets;assets" --add-data "magi-gui/dist;magi-gui/dist" magi/main.py

    - name: Zip Release
      run: |
        Compress-Archive -Path "dist/MAGI-IDE-v5.exe" -DestinationPath "dist/MAGI-IDE-v5.zip"

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: "MAGI System IDE ${{ github.ref_name }}"
        files: dist/MAGI-IDE-v5.zip
        body: |
          ## Novedades en ${{ github.ref_name }} 🚀
          
          - **Pegar Capturas Directamente desde el Portapapeles (Ctrl+V):** Integrado capturador global de portapapeles. Al usar la Herramienta de Recorte de Windows (`Win+Shift+S`) y presionar `Ctrl+V` en cualquier parte de la app, la imagen se adjunta automáticamente en Naoko.
          - **Solución Definitiva de Resiliencia del Enjambre (`orchestrator.py`):** Corregida la llamada a `self.bus.publish` en bloques de excepción del orquestador, evitando que tareas colapsen silenciosamente en `in_progress`.
          - **Unificación de Tipografía e Inspección de Negritas (`App.css` & `App.tsx`):** Enforzada tipografía uniforme sans-serif (`Inter`) de 13px y normalizado el parser de etiquetas markdown para evitar fugas de estilo negrita en tarjetas.
          - **Control Estricto de Capas y Acordeón Desplegable (`z-index: 10`):** Asegurado que la expansión de tarjetas ocurra dentro del contenedor `.conv` sin desplazar o sobreponerse a la barra inferior de ejecución `SYS_EXEC`.
        draft: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
