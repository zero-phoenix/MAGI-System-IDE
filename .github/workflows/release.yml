name: Build and Release MAGI System IDE

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller pywebview

    - name: Build Frontend
      working-directory: ./magi-gui
      run: |
        npm install
        npm run build

    - name: Build Executable (PyInstaller)
      run: |
        pyinstaller --clean --onefile --noconsole --name "MAGI-IDE-v5" --icon "assets/icon.ico" --add-data "assets;assets" --add-data "magi-gui/dist;magi-gui/dist" magi/main.py

    - name: Zip Release
      run: |
        Compress-Archive -Path "dist/MAGI-IDE-v5.exe" -DestinationPath "dist/MAGI-IDE-v5.zip"

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: "MAGI System IDE ${{ github.ref_name }}"
        files: dist/MAGI-IDE-v5.zip
        body: |
          ## Novedades en ${{ github.ref_name }} 🚀
          
          - **Solución al Crash de Inicio GUI (`main.py`):** Eliminado el argumento `icon=` no soportado en `webview.create_window()`, solucionando la excepción fatal `TypeError` al iniciar el ejecutable.
          - **Restauración Total de Motores de IA (`FreeCloudLLM`):** Reemplazada la iteración sobre proveedores fallidos por auto-enrutamiento dinámico en G4F y rotación de modelos (`gpt-4o` -> `gpt-4o-mini` -> `gpt-4` -> `llama-3.1-70b` -> `qwen-2.5-coder`).
          - **Operatividad del Enjambre (Melchior, Balthasar, Casper) y Naoko:** Todos los agentes vuelven a generar propuestas, críticas, arbitrajes y diagnósticos autónomos sin colapsos ni demoras.
          - **Estabilidad y Corrección de Linters:** Parche de lectura segura de payloads en `NaokoAgent` y tipado en `CloudAPIProvider`.
          - **Documentación:** README actualizado con diagrama unidireccional vertical y ramificaciones horizontales de arquitectura.
        draft: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
