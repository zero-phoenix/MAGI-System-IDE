name: Build and Release MAGI System IDE

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Etiqueta a publicar (debe existir como tag git)'
        required: true
        default: 'v5.1.1'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.RELEASE_TAG }}
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    # De requirements.txt, nunca a mano: ver la nota en ci.yml. Enumerar aquí
    # es lo que dejó este mismo job sin `websockets` y sin `numpy`, y este job
    # es el que decide si hay .exe.
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Install ffmpeg
      run: sudo apt-get update && sudo apt-get install -y ffmpeg
    - name: Run test suite
      run: python -m pytest tests/ -v
    - name: Verify no absolute machine paths
      run: |
        ! grep -rnE "D:/PROYECTOS\|d:/PROYECTOS\|C:\\\\Users\\\\[A-Za-z]" \
          --include="*.py" --include="*.json" --include="*.toml" --include="*.yml" --include="*.yaml" \
          --exclude=paths.py --exclude=naoko_repair.py \
          magi/ pyrightconfig.json pyproject.toml || \
          (echo "Ruta absoluta detectada: el .exe no arrancaría en otra maquina" && exit 1)

  build:
    runs-on: windows-latest
    needs: test          # sin tests verdes no hay release
    env:
      # En push de tag vale github.ref_name ("v5.1.1"); en dispatch manual
      # tomamos el input. Así un mismo workflow sirve para ambas vías.
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
    - name: Checkout repository (en el tag a publicar)
      uses: actions/checkout@v4
      with:
        ref: ${{ env.RELEASE_TAG }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    # Node 22 y `npm ci`, EXACTAMENTE igual que el job `gui` de ci.yml. Antes
    # este job usaba Node 20 con `npm install`: dos diferencias con lo que CI
    # deja en verde, y cualquiera de las dos puede tumbar el release de un
    # commit ya probado. Vite 7 exige `^20.19.0 || >=22.12.0`, así que un
    # `node-version: '20'` que resolviera a 20.18 fallaría; y `npm install`
    # ignora el lock y puede instalar versiones distintas de las probadas.
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: magi-gui/package-lock.json

    # DEL LOCK, NO DE requirements.txt — y la diferencia con el job `test` de
    # arriba es deliberada, no un descuido.
    #
    # El job `test` instala de requirements.txt: prueba que el proyecto sigue
    # funcionando con las versiones de HOY, que es donde quieres enterarte de
    # que un upstream ha roto algo.
    #
    # Este job compila el binario que se PUBLICA. Aquí no se quiere la última
    # versión: se quiere exactamente la que se probó. Sin lock, recompilar este
    # mismo tag dentro de seis meses produce un .exe distinto, y una versión
    # publicada que no se puede reproducir no se puede depurar.
    #
    # El lock es de Windows (lleva pythonnet/clr-loader, de pywebview) y por eso
    # solo se usa aquí. Ver la cabecera de requirements.lock.
    - name: Install Python dependencies (bloqueadas)
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.lock
        pip install pyinstaller pywebview

    - name: Build Frontend
      working-directory: ./magi-gui
      run: |
        npm ci
        npm run build

    # SE COMPILA CON EL .spec, NO CON LA LÍNEA DE COMANDOS
    # ===================================================
    # Antes esta receta iba escrita a mano aquí, y `MAGI-IDE-v5.spec` se usaba
    # solo en local. Dos recetas para el mismo binario es una que se queda
    # atrás, y ya pasó: al externalizar el catálogo de proveedores se añadió
    # `--add-data "magi/data;magi/data"` al .spec, y esta línea no se enteró.
    # El .exe publicado habría arrancado con el respaldo de las constantes —
    # funciona, pero pierde justo lo que se buscaba: poder arreglar un
    # proveedor caído sin recompilar 158 MB.
    #
    # Con el .spec hay una sola receta y esta clase de deriva no puede ocurrir.
    # Los `--exclude-module` (torch y compañía) también viven ahí: entran de
    # polizón por g4f/tools/files.py -> markitdown -> magika -> onnxruntime, y
    # además de hinchar el binario colgaban la compilación indefinidamente en
    # torch/__init__.py:265.
    - name: Build Executable (PyInstaller, desde el .spec)
      run: pyinstaller --clean --noconfirm MAGI-IDE-v5.spec

    - name: Verificar que lo que hace falta viajó dentro
      # Las tres cosas que un .exe puede perder SIN dar error al arrancar, que
      # es lo que las hace peligrosas: se publicaría un binario que parece
      # bueno y hace la mitad.
      run: |
        if (-not (Test-Path "magi/data/catalogo_proveedores.json")) {
          throw "falta magi/data/catalogo_proveedores.json en el repo"
        }

        # El Python embebido. Sin él, `sys.executable` dentro del onefile es el
        # propio .exe y el binario se queda sin intérprete: run_tests,
        # python_exec, la verificación de propuestas y el bucle de observación
        # dejan de poder trabajar. El sistema lo DICE en vez de fingir, así que
        # el fallo no se ve al arrancar — solo cuando intentas usarlo.
        if (-not (Test-Path "assets/python-embed/extracted/python.exe")) {
          throw "falta el Python embebido (assets/python-embed/extracted): el .exe no podria ejecutar nada"
        }

        if (-not (Test-Path "dist/MAGI-IDE-v5.exe")) {
          throw "PyInstaller no produjo el .exe"
        }

        # QUE EL EMBEBIDO ESTÉ EN EL REPO NO PRUEBA QUE ENTRARA EN EL BINARIO.
        #
        # Se comprueba en el inventario que PyInstaller deja al empaquetar, que
        # es evidencia directa de lo que viajó dentro. La primera versión de
        # esta comprobación usaba el tamaño del .exe como proxy y se equivocó:
        # puse el suelo en 120 MB razonando «94 MB que pesaba antes + 43 del
        # embebido», y el binario salió a 107,3 porque dentro va comprimido.
        # Sumar tamaños en disco para predecir el de un archivo comprimido es
        # inventarse un número — y tumbó un build correcto.
        $toc = "build/MAGI-IDE-v5/Analysis-00.toc"
        if (-not (Test-Path $toc)) { throw "no encuentro el inventario $toc" }
        if (-not (Select-String -Path $toc -Pattern "python-embed" -Quiet)) {
          throw "el Python embebido NO entro en el binario: el .exe publicado no podria ejecutar nada"
        }
        Write-Host "python embebido: dentro del binario (verificado en el inventario)"

        # Y un suelo de tamaño, ahora sí MEDIDO y no calculado: 94,1 MB sin
        # embebido (v5.2.0) y 107,3 con él (v5.3.0). 100 queda entre los dos.
        $mb = [math]::Round((Get-Item "dist/MAGI-IDE-v5.exe").Length / 1MB, 1)
        Write-Host "exe: $mb MB"
        if ($mb -lt 100) { throw "el .exe pesa $mb MB: se quedo algo fuera" }

    - name: Zip Release
      # El usuario descarga un .zip, no el .exe suelto: Windows y muchos
      # navegadores bloquean o avisan sobre un .exe descargado directamente.
      run: |
        Compress-Archive -Path "dist/MAGI-IDE-v5.exe" -DestinationPath "dist/MAGI-IDE-v5.zip" -Force
        $z = [math]::Round((Get-Item "dist/MAGI-IDE-v5.zip").Length / 1MB, 1)
        Write-Host "zip: $z MB"

    - name: Checksums SHA256
      # El binario no está firmado y SmartScreen asusta; lo que SÍ se puede
      # garantizar es la integridad: quien descargue puede verificar con
      # `certutil -hashfile MAGI-IDE-v5.zip SHA256` contra CHECKSUMS.txt.
      # Se generan del .zip Y del .exe interno por si alguien descomprime.
      run: |
        $h1 = (Get-FileHash "dist/MAGI-IDE-v5.zip" -Algorithm SHA256).Hash
        $h2 = (Get-FileHash "dist/MAGI-IDE-v5.exe" -Algorithm SHA256).Hash
        "$($h1.ToLower())  MAGI-IDE-v5.zip"  | Out-File dist/CHECKSUMS.txt -Encoding ascii -Append
        "$($h2.ToLower())  MAGI-IDE-v5.exe"  | Out-File dist/CHECKSUMS.txt -Encoding ascii -Append
        Get-Content dist/CHECKSUMS.txt

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        name: "MAGI System IDE ${{ env.RELEASE_TAG }}"
        files: |
          dist/MAGI-IDE-v5.zip
          dist/CHECKSUMS.txt
        body_path: RELEASE_NOTES.md
        draft: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
