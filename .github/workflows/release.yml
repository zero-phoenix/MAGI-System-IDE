name: Build and Release MAGI System IDE

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller pywebview

    - name: Build Frontend
      working-directory: ./magi-gui
      run: |
        npm install
        npm run build

    - name: Build Executable (PyInstaller)
      run: |
        pyinstaller --clean --onefile --noconsole --name "MAGI-IDE-v5" --add-data "magi-gui/dist;magi-gui/dist" magi/main.py

    - name: Create Release and Upload Asset
      uses: softprops/action-gh-release@v2
      with:
        files: dist/MAGI-IDE-v5.exe
        name: "MAGI System IDE V5.0.2 - Agentic Mode & Strict Constraints"
        body: |
          ### 🚀 Actualizaciones y Modificaciones (V5.0.2):
          - **Modo Agentic Completo:** MAGI ahora es consciente de que corre en Windows. Puede ejecutar scripts y comandos localmente sobre la carpeta del proyecto a través de la interfaz usando el botón `Ejecutar en PC`.
          - **Aislamiento de Contextos:** Se agregó un botón `Nueva Consulta` para limpiar la memoria del enjambre y evitar contaminación entre tareas independientes.
          - **Audio Personalizado:** Sustitución de osciladores web básicos por archivos MP3 de alta fidelidad para el feedback auditivo de los agentes.
          - **Regla Estricta de 3 Rondas:** El Enjambre está bloqueado algorítmicamente para dar al menos 3 vueltas de Refinamiento (Melchior) y Crítica Falsacionista (Balthasar) antes de permitir una aprobación final.
          - **Aprobación Interactiva (Casper):** Al alcanzar un consenso, el debate se pausa y Casper pedirá autorización explícita al usuario antes de permitir la ejecución de cualquier código. Melchior y Balthasar tienen prohibido hacer preguntas.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
