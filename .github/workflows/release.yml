name: Build and Release MAGI System IDE

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-asyncio httpx g4f pydantic
    - name: Run test suite
      run: python -m pytest tests/ -v
    - name: Verify no absolute machine paths
      run: |
        ! grep -rn "D:/PROYECTOS\|d:/PROYECTOS" --include="*.py" magi/ \
          --exclude=paths.py --exclude=naoko_repair.py || \
          (echo "Ruta absoluta detectada: el .exe no arrancaría en otra maquina" && exit 1)

  build:
    runs-on: windows-latest
    needs: test          # sin tests verdes no hay release

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller pywebview

    - name: Build Frontend
      working-directory: ./magi-gui
      run: |
        npm install
        npm run build

    - name: Build Executable (PyInstaller)
      run: |
        pyinstaller --clean --onefile --noconsole --name "MAGI-IDE-v5" --icon "assets/icon.ico" --add-data "assets;assets" --add-data "magi-gui/dist;magi-gui/dist" magi/main.py

    - name: Zip Release
      run: |
        Compress-Archive -Path "dist/MAGI-IDE-v5.exe" -DestinationPath "dist/MAGI-IDE-v5.zip"

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: "MAGI System IDE ${{ github.ref_name }}"
        files: dist/MAGI-IDE-v5.zip
        body_path: RELEASE_NOTES.md
        draft: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
