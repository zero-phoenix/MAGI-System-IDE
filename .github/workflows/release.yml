name: Build and Release MAGI System IDE

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller pywebview

    - name: Build Frontend
      working-directory: ./magi-gui
      run: |
        npm install
        npm run build

    - name: Build Executable (PyInstaller)
      run: |
        pyinstaller --clean --onefile --noconsole --name "MAGI-IDE-v5" --add-data "magi-gui/dist;magi-gui/dist" magi/main.py

    - name: Create Release and Upload Asset
      uses: softprops/action-gh-release@v2
      with:
        files: dist/MAGI-IDE-v5.exe
        name: "MAGI System IDE V5.0.0 - Auto-Routing & Scroll Fix"
        body: |
          ### 🚀 Actualizaciones y Modificaciones (V5.0.0):
          - **Enrutamiento G4F Dinámico (Anti-429):** El núcleo intercepta solicitudes a modelos caídos y los redirige de forma transparente al proveedor más estable (`gpt-4o`) para evitar el colapso del Enjambre. Funciona nativamente sin keys.
          - **UI Master Layout:** La Consola y el panel de conversaciones ahora soportan auto-scroll real sin desbordar el contenedor en Windows.
          - **Selección de Texto:** Los comandos y los códigos del enjambre ya pueden ser copiados libremente.
          - **Panel de Configuración:** Incorporado como pestaña nativa en el lienzo derecho para gestión interna.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
