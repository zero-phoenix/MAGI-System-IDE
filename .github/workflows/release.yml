name: Build and Release MAGI System IDE

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller pywebview

    - name: Build Frontend
      working-directory: ./magi-gui
      run: |
        npm install
        npm run build

    - name: Build Executable (PyInstaller)
      run: |
        pyinstaller --clean --onefile --noconsole --name "MAGI-IDE-v5" --icon "assets/icon.ico" --add-data "assets;assets" --add-data "magi-gui/dist;magi-gui/dist" magi/main.py

    - name: Zip Release
      run: |
        Compress-Archive -Path "dist/MAGI-IDE-v5.exe" -DestinationPath "dist/MAGI-IDE-v5.zip"

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: "MAGI System IDE ${{ github.ref_name }}"
        files: dist/MAGI-IDE-v5.zip
        body: |
          ## Novedades en ${{ github.ref_name }} 🚀
          
          - **Solución del Scroll en Conversación (`.conv`):** Habilitada barra de desplazamiento visible (`::-webkit-scrollbar`), `overflow-y: auto` dinámico y autoscroll suave `chatEndRef` para navegación continua por todas las tarjetas del Enjambre.
          - **Autoconciencia de Interfaz Gráfica en Naoko (`NaokoAgent`):** Naoko fue dotada de conocimiento completo sobre el Layout Maestro (4 columnas, tarjetas de agentes, pestañas y paneles), permitiéndole diagnosticar temas de navegación visual reportados por el usuario.
          - **Icono del Ejecutable Nativo en Escritorio de Windows (PyInstaller `.spec`):** Embebido el recurso RGBA multi-tamaño `assets/icon.ico` directamente en los archivos `.spec` de PyInstaller, garantizando que el logo oficial de MAGI aparezca en el icono `.exe` fuera y dentro del sistema.
          - **Respuesta Final Contextualizada:** Al responder "sí" a las propuestas, Casper entrega la explicación/código completo, profundo y detallado.
        draft: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
