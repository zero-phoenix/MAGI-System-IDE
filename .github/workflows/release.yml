name: Build and Release MAGI System IDE

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller pywebview

    - name: Build Frontend
      working-directory: ./magi-gui
      run: |
        npm install
        npm run build

    - name: Build Executable (PyInstaller)
      run: |
        pyinstaller --clean --onefile --noconsole --name "MAGI-IDE-v5" --add-data "magi-gui/dist;magi-gui/dist" magi/main.py

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v5.0.9
        name: "MAGI System IDE V5.0.9"
        files: dist/MAGI-IDE-v5.exe
        body: |
          ## Novedades en V5.0.9 🚀
          
          - **Auto-Ejecución Nativa:** Casper ahora aprueba e instruye a MAGI para que extraiga todo el código de la propuesta y lo corra automáticamente en segundo plano (Python y Scripts Shell) cuando escribes "sí", haciéndolo un verdadero IDE autónomo y sin fricción.
          - **Formateo Limpio:** Se resolvió el error de diseño en donde Casper devolvía un código JSON crudo que rompía la UI; ahora se lee como Markdown pulcro y con su respectivo resaltado.
          - **Inteligencia Arbítrial Mejorada:** Se ha extendido el Scope de Casper. Ya no solo resume pasivamente, sino que dirige y corrige científicamente a los otros agentes, brindando directivas sólidas a nivel de software.
          - **Persistencia A Prueba de Fallas:** Arreglado un Crash severo al enviar varias consultas (`UNIQUE constraint failed`) por problemas de DB.
        draft: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
