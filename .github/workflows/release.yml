name: Build and Release MAGI System IDE

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller pywebview

    - name: Build Frontend
      working-directory: ./magi-gui
      run: |
        npm install
        npm run build

    - name: Build Executable (PyInstaller)
      run: |
        pyinstaller --clean --onefile --noconsole --name "MAGI-IDE-v5" --icon "assets/icon.ico" --add-data "assets;assets" --add-data "magi-gui/dist;magi-gui/dist" magi/main.py

    - name: Zip Release
      run: |
        Compress-Archive -Path "dist/MAGI-IDE-v5.exe" -DestinationPath "dist/MAGI-IDE-v5.zip"

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: "MAGI System IDE ${{ github.ref_name }}"
        files: dist/MAGI-IDE-v5.zip
        body: |
          ## Novedades en ${{ github.ref_name }} 🚀
          
          - **Eliminación Total de Redundancia "CONCLUSIÓN" (`AgentMessageCard`):** Limpieza exhaustiva de patrones repetitivos (`CONCLUSIÓN`, `CONCLUSIÓN SÍNTESIS`, `### CONCLUSIÓN`). Las tarjetas comienzan directamente con la respuesta limpia sin duplicar encabezados.
          - **Scroll Vertical Ilimitado Permanente en Enjambre (`.conv`):** Habilitada barra de desplazamiento continua (`overflow-y: scroll !important`, `scrollbar-width: thin`), permitiendo navegar por todo el historial sin bloqueos ni límites de altura.
          - **Aislamiento de Capas e Inmunidad de Márgenes (`z-index: 10`):** Al desplegar `Ver análisis completo ▾`, las tarjetas expanden su altura dentro del flujo interno de la columna central sin empujar la barra superior ni solaparse con la caja de texto inferior `SYS_EXEC`.
          - **Tipografía Limpia Sans-Serif en Párrafos (Peso 400):** Normalizadas las reglas CSS para garantizar que solo las palabras clave marcadas intencionalmente se rendericen en negrita (`strong`).
        draft: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
