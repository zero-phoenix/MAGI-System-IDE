name: Build and Release MAGI System IDE

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller pywebview

    - name: Build Frontend
      working-directory: ./magi-gui
      run: |
        npm install
        npm run build

    - name: Build Executable (PyInstaller)
      run: |
        pyinstaller --clean --onefile --noconsole --name "MAGI-IDE-v5" --add-data "magi-gui/dist;magi-gui/dist" magi/main.py

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v5.0.11
        name: "MAGI System IDE V5.0.11"
        files: dist/MAGI-IDE-v5.exe
        body: |
          ## Novedades en V5.0.11 🚀
          
          - **Pestaña de Estado de Motores IA (G4F Auto-Routing):** Se agregó visualización interactiva del Estado de las IAs, latencia, aciertos y fallos de la telemetría, y configuración del Auto-Routing.
          - **Diff Viewer (Aprobación Interactiva):** Ahora cuando MELCHIOR o BALTHASAR proponen código, se activa un Diff Viewer de validación antes de ejecutar los comandos locales.
          - **Rediseño Gráfico README:** El `README.md` se actualizó a un único diagrama vertical de arquitectura ultra-detallado, como se solicitó.
          - **Sonidos Locales:** Reactivación de los beeps custom para decisiones (C:\Users\D\Desktop\Nueva carpeta\reelsvideo (mp3cut.net).mp3).
          - **Selector de Motores AI:** Dinamismo mejorado para elegir entre "fast" (GPT-4o mini) o "smart" (GPT-4o).
        draft: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
