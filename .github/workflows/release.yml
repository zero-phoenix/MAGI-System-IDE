name: Build and Release MAGI System IDE

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller pywebview

    - name: Build Frontend
      working-directory: ./magi-gui
      run: |
        npm install
        npm run build

    - name: Build Executable (PyInstaller)
      run: |
        pyinstaller --clean --onefile --noconsole --name "MAGI-IDE-v5" --icon "assets/icon.ico" --add-data "assets;assets" --add-data "magi-gui/dist;magi-gui/dist" magi/main.py

    - name: Zip Release
      run: |
        Compress-Archive -Path "dist/MAGI-IDE-v5.exe" -DestinationPath "dist/MAGI-IDE-v5.zip"

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: "MAGI System IDE ${{ github.ref_name }}"
        files: dist/MAGI-IDE-v5.zip
        body: |
          ## Novedades en ${{ github.ref_name }} 🚀
          
          - **Icono del Ejecutable Nativo en Windows 100% Cuadrado 1:1 RGBA (`assets/icon.ico`):** Re-generado `assets/icon.ico` con dimensiones cuadradas exactas (256x256, 128x128, 64x64, 48x48, 32x32, 16x16) en formato RGBA, solucionando el problema donde el explorador de Windows rechazaba el icono ejecutable por dimensiones no cuadradas.
          - **Eliminación Total de Texto Negrita Indeseado (`AgentMessageCard`):** Eliminado el prefijo markdown `###` de las conclusiones que forzaba a la interfaz a renderizar todo el cuerpo de la tarjeta como un encabezado `<h3>` negrita. Ahora el texto usa peso normal (400) y solo resalta en negrita las palabras clave intencionadas.
          - **Barra de Desplazamiento Permanente Visible (`.conv`):** Enforzado `overflow-y: scroll !important` con reglas WebKit/Firefox dedicadas (`scrollbar-width: thin`), haciendo visible la barra vertical de desplazamiento en Windows PyWebView sin depender de interacciones de hover.
          - **Insignia "💡 CONCLUSIÓN SÍNTESIS":** Añadida una etiqueta visual distintiva que encabeza cada síntesis sin alterar la tipografía del cuerpo del mensaje.
        draft: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
