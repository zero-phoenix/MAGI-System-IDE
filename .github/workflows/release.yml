name: Build and Release MAGI System IDE

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller pywebview

    - name: Build Frontend
      working-directory: ./magi-gui
      run: |
        npm install
        npm run build

    - name: Build Executable (PyInstaller)
      run: |
        pyinstaller --clean --onefile --noconsole --name "MAGI-IDE-v5" --add-data "magi-gui/dist;magi-gui/dist" magi/main.py

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v5.0.10
        name: "MAGI System IDE V5.0.10"
        files: dist/MAGI-IDE-v5.exe
        body: |
          ## Novedades en V5.0.10 🚀
          
          - **Gráfico de Arquitectura Ultra-Detallado:** Se rediseñó por completo el `README.md`. Ahora el gráfico Mermaid es 100% integral y unidireccional, abarcando gráficamente y con alto detalle toda la explicación horizontal de los procesos en 4 Niveles interconectados (Host, Orquestación, Cloud y Auto-Ejecución).
        draft: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
