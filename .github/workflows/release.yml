name: Build and Release MAGI System IDE

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller pywebview

    - name: Build Frontend
      working-directory: ./magi-gui
      run: |
        npm install
        npm run build

    - name: Build Executable (PyInstaller)
      run: |
        pyinstaller --clean --onefile --noconsole --name "MAGI-IDE-v5" --add-data "magi-gui/dist;magi-gui/dist" magi/main.py

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v5.0.12
        name: "MAGI System IDE V5.0.12"
        files: dist/MAGI-IDE-v5.exe
        body: |
          ## Novedades en V5.0.12 🚀
          
          - **Pestaña de Código Integrada (Mónaco Editor):** Explorador de archivos totalmente sincronizado. Al seleccionar archivos, su código fuente se carga automáticamente en el motor Monaco integrado (el mismo de VS Code).
          - **Pestaña de Plan Activo:** Ahora la interfaz escanea la memoria del enjambre para extraer el plan táctico de Melchior (`### PLAN`) y lo renderiza de forma elegante en Markdown.
          - **Gráfico HDC de Interacción (React Flow):** El backend hiperdimensional ahora mapea de manera visual e interactiva el flujo de pensamiento de los agentes a través de la conversación actual.
          - **Rediseño Gráfico Definitivo:** Se actualizó `README.md` con un único y detallado gráfico vertical unidireccional, simplificando la comprensión de la arquitectura general del sistema y los flujos asíncronos.
        draft: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
