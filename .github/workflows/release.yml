name: Build and Release MAGI System IDE

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller pywebview

    - name: Build Frontend
      working-directory: ./magi-gui
      run: |
        npm install
        npm run build

    - name: Build Executable (PyInstaller)
      run: |
        pyinstaller --clean --onefile --noconsole --name "MAGI-IDE-v5" --icon "assets/icon.ico" --add-data "magi-gui/dist;magi-gui/dist" magi/main.py

    - name: Zip Release
      run: |
        Compress-Archive -Path "dist/MAGI-IDE-v5.exe" -DestinationPath "dist/MAGI-IDE-v5.zip"

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v5.0.19
        name: "MAGI System IDE V5.0.19"
        files: dist/MAGI-IDE-v5.zip
        body: |
          ## Novedades en V5.0.19 🚀
          
          - **Retorno al formato Single Portable EXE:** El ejecutable vuelve a ser un único archivo autónomo y portable dentro del ZIP, sin la carpeta `_internal`.
          - **Solución del Bug -1 de Numpy:** Se aplicó un parche profundo de dependencias (rollback de librerías DLL masivas de cálculo matricial) que soluciona definitivamente el error `decompression resulted in return code -1!` en Windows, manteniendo el modo portable `--onefile`.
          - **Nuevo Ícono de Sistema:** Se ha asignado oficialmente el logo hexagonal de MAGI al ejecutable.
          - **Memoria Persistente de Errores:** Naoko cuenta con su propia tabla SQLite (`naoko_memory`) para recordar soluciones pasadas y evitar aplicar el mismo parche dos veces.
          - **Autodiagnóstico y Reparación de Nube:** Se implementó un bucle infinito de autodiagnóstico en el orquestador (`cloud.py`). Si la IA gratuita de la nube sufre un Error 429 (Rate Limit), el sistema **no abortará**, sino que reportará de manera super detallada en la terminal el fallo, congelará los hilos de manera inteligente (backoff) y rotará los proxies/proveedores hasta lograr conexión.
          - **Mensajes de Usuario Siempre Visibles:** El chat ha sido rediseñado para que tu interacción (User Input) JAMÁS se oculte; siempre ocupará el 100% de legibilidad de forma permanente.
          - **IA con Análisis Oculto pero Conclusión Clara:** El cuerpo preliminar (razonamiento) de los agentes (Melchior, Balthasar, Casper) viene **oculto completamente por defecto**, dejando únicamente la **Conclusión final visible**. Con un simple click puedes expandir o retraer el texto del análisis sin ventanas emergentes.
          - **Solo IA Nube Gratis:** Se ha garantizado la persistencia del enrutamiento hacia motores de la nube mediante G4F, sin necesidad de inferencia local.
          - **Corrección Mermaid README:** Se corrigió un error de sintaxis que impedía que el gráfico HDC vertical unidireccional se viera en GitHub.
        draft: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
