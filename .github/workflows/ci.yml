name: CI

# Plan MAGI 9.0 §1.5 — tests en cada push, no solo al publicar.
# v5.0.28 no tenía CI de tests: los test_area*.py vivían en scratch/ (que está
# en .gitignore) y test_area0 estaba en rojo sin que nada lo detectara.

on:
  push:
    branches: [main, "magi-*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]   # la paridad de rutas se comprueba en ambas
        python: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}
        cache: 'pip'

    # Se instala de requirements.txt y NO se enumeran paquetes aquí. La lista
    # a mano se quedó atrás dos veces: primero sin `websockets` (lo importa
    # test_rpc_transport arriba) y después sin `numpy`/`scikit-learn` (los
    # importa magi/modules/skills/loader.py, que carga el kernel). En ambos
    # casos la suite entera se caía en el runner y el release se quedaba sin
    # .exe. test_wiring.py::test_los_workflows_instalan_desde_requirements
    # impide volver a enumerar.
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Sin ffmpeg, los tests del bucle de observación de vídeo se SALTAN. Verde
    # sin comprobar nada es peor que rojo: el fallo que cazan —vídeo en negro
    # o congelado— es justo el que pasa todas las comprobaciones baratas.
    - name: Install ffmpeg (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y ffmpeg

    # En Windows faltaba, y ahí los tests de vídeo no se saltaban: FALLABAN,
    # porque comprueban el mensaje de "no existe el punto de entrada" y lo que
    # recibían era "ffmpeg no está instalado". Dos fallos permanentes en rojo
    # que no eran del código. Instalarlo también aquí es lo coherente con la
    # nota de arriba: verde sin comprobar nada es peor que rojo, así que se
    # comprueba de verdad en las dos plataformas.
    - name: Install ffmpeg (Windows)
      if: runner.os == 'Windows'
      run: choco install ffmpeg -y --no-progress

    - name: Run tests
      run: python -m pytest tests/ -v --tb=short

    # Cobertura de magi/core/ (informativa). continue-on-error: la cobertura
    # está hoy en ~79%; cuando suba, se puede convertir en umbral bloqueante.
    # Solo en Linux para no duplicar el reporte en la matriz de OS.
    - name: Coverage report (magi/core)
      if: runner.os == 'Linux'
      continue-on-error: true
      run: python -m pytest tests/ -q --cov=magi/core --cov-report=term --cov-config=/dev/null

    - name: Check imports resolve
      run: |
        python -c "
        import magi.core.paths, magi.core.context, magi.core.router
        import magi.core.prompts, magi.core.agent_loop
        import magi.core.providers.registry, magi.core.providers.cloud
        import magi.core.tools
        print('todos los módulos del núcleo importan')
        "

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install ruff
      run: pip install ruff

    - name: Syntax and undefined names (bloqueante)
      run: ruff check magi/ tests/ --select E9,F63,F7,F82

    - name: Lint completo (informativo — deuda técnica visible)
      # --exit-zero: nunca falla el workflow, solo publica el conteo en el log.
      # El objetivo es visibilidad progresiva: cuando la deuda baje, este step
      # pasa a bloqueante. Por ahora, reportar sin romper el desarrollo.
      run: ruff check magi/ tests/ --statistics --exit-zero || true

    - name: Type check (informativo)
      # pyright lee pyrightconfig.json. continue-on-error: nunca falla el
      # workflow. Misma idea que con ruff: visibilidad progresiva. El tipado de
      # magi/ es parcial; cuando la cuenta de errores baje, quitamos el flag.
      continue-on-error: true
      run: |
        pip install pyright
        pyright magi/

    - name: No hardcoded machine paths
      run: |
        if grep -rnE "D:/PROYECTOS\|d:/PROYECTOS\|C:\\\\Users\\\\[A-Za-z]" --include="*.py" magi/ \
           | grep -v "paths.py" | grep -v "naoko_repair.py" | grep -v "_attic"; then
          echo "::error::Ruta absoluta a una máquina concreta. Usa magi.core.paths."
          exit 1
        fi
        echo "sin rutas absolutas"

    - name: Database must not be committed
      run: |
        if git ls-files | grep -q "magi_brain.db"; then
          echo "::error::magi_brain.db versionado (contiene datos reales del usuario)"
          exit 1
        fi
        echo "base de datos fuera del repositorio"

  gui:
    # Plan MAGI 9.0 §7 — la regla "sin tests verdes no hay release" valía solo
    # para la mitad del sistema: 443 tests en Python y CERO en la interfaz.
    # El diff de aprobación llevaba meses sin mostrar nada y nada lo detectó.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: magi-gui
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: magi-gui/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Tests
      run: npm test

    - name: Type check and build
      run: npm run build
